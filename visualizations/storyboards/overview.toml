# The narrated story; plans/*.py controls visual states and per-beat captions.
# This is an explanation of a source snapshot, not a formal security certificate.
[deck]
title = "Transcrypt v3: from ordinary files to a public Git history"
subtitle = "Where plaintext moves, which production functions are proved, and which assumptions remain"
source_baseline = "88001fd (2026-10-25), reconciled against V3-ROADMAP and PROOF-STATUS"
reference_visual_style = "aivm-secrets/visualizations: editable beats, role colors, honest evidence levels"

[[scene]]
id = "legend"
file = "tvis/scenes/legend.py"
class = "VisualLegend"
plan = "tvis.plans.legend"
status = "architecture"
claim = "Payload colors indicate data types independently of evidence badges on executable operations: source-derived proof, conditional theorem, model proof, tested adapter, trusted external crypto, and trusted Git/OS."
narration = "Watch two independent signals. A moving token identifies plaintext, a sealed record, a key, a path, metadata or a decision; its color never implies security evidence. Under a node, a separate badge names the evidence for that specific operation. Unconditional source-derived Lean theorems are green, and conditional seal and open theorems still require Realizes. Purple means a Lean sequencing model only, teal means a tested unproved adapter, and amber indicates cryptographic or operating-system assumptions. Green is never a blanket claim about a Git command or a public remote."
sources = ["docs/verification/V3-PROOF-COVERAGE.md", "docs/verification/V3-ASSUMPTIONS.md", "docs/verification/specs/V3-AUTHENTICATED-P0.md", "proofs/aeneas/v3/V3Wire/Verification/Path.lean"]

[[scene]]
id = "selection"
file = "tvis/scenes/selection.py"
class = "ProtectedSelection"
plan = "tvis.plans.selection"
status = "runtime-tested"
claim = "In source snapshot 88001fd, native Git attribute patterns select protected paths; source-derived Lean checks parse Git answers and enforce canonical path policy, while Git evaluation is trusted under A19."
narration = "The current implementation accepts native Git attribute patterns, including dot env files and directory wildcard patterns, with reserved metadata excluded. This is implemented and tested now, not a pending wish. Git performs the actual attribute matching. The production Rust parsing loop has a source-derived theorem for exact answers and path flags. Cryptographic sealing then binds the exact raw Git relative pathname, not a hardcoded dot secret suffix. The visualization marks Git as an external platform premise A19 and the parsing operation as Lean source-derived: the two steps are not interchangeable."
sources = ["docs/verification/V3-USER-GUIDE.md", "docs/verification/V3-PROOF-COVERAGE.md", "docs/verification/V3-ASSUMPTIONS.md", "proofs/aeneas/v3/V3Wire/Verification/Path.lean", "proofs/aeneas/v3/V3Wire/Verification/Attr.lean", "rust/crates/transcrypt-v3-core/src/lib.rs"]
optional_sources = ["docs/verification/V3-PRODUCT-CHARTER.md"]
proof_anchors = ["is_canonical_protected_path_spec", "parse_attr_response_spec"]

[[scene]]
id = "unlock"
file = "tvis/scenes/unlock.py"
class = "UnlockKeyLifecycle"
plan = "tvis.plans.unlock"
status = "runtime-tested"
claim = "Default unlock derives a local key with trusted Argon2id, conditionally proved config authentication, then tested native credential storage A17; --private selects optional memory agent."
narration = "Follow the passphrase across four operations. The developer provides it locally along with the salt in the public configuration. Argon2id runs in external RustCrypto code and is supported by differential tests, not a Lean correctness theorem. The actual production authenticate_config function has a source-derived Lean proof conditional on Realizes for the external crypto primitive. Only if authentication succeeds does the native adapter activate the unlocked mode. The default stores a derived key in private Git metadata, surviving reboot; optional private mode uses an in-memory agent. Key persistence, OS permissions and exposure to same-UID processes remain outside Lean."
sources = ["rust/crates/transcrypt-rs/src/setup.rs", "rust/crates/transcrypt-rs/src/lib.rs", "rust/crates/transcrypt-rs/src/credential.rs", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "docs/verification/V3-ASSUMPTIONS.md", "docs/verification/V3-PROOF-COVERAGE.md"]
proof_anchors = ["authenticate_config_spec"]

[[scene]]
id = "clean"
file = "tvis/scenes/clean.py"
class = "GitCleanFlow"
plan = "tvis.plans.clean"
status = "source-derived-proof"
claim = "Git invokes a real tested clean adapter; seal_record is proved against the independent spec only under Realizes, while Git object behavior and AES-SIV are external premises."
narration = "The developer edits a normal plaintext file selected by Git attributes. Git passes both bytes and pathname to a native Rust clean-filter adapter, which is tested but not fully source-derived proved. The extracted seal_record function has a conditional Lean theorem for the exact record and context; the proof requires the external Keyed crypto primitive to realize its specification. The input plaintext remains in the unlocked local worktree. The output token changes to a ciphertext v3 envelope only after the crypto call; the public Git index and remote hold the resulting record. Follow the dedicated sealing scene to see the RustCrypto step separately from the proof."
sources = ["rust/crates/transcrypt-rs/src/main.rs", "rust/crates/transcrypt-rs/src/lib.rs", "rust/crates/transcrypt-v3-core/src/lib.rs", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "docs/verification/V3-PROOF-COVERAGE.md"]
proof_anchors = ["seal_record_spec"]

[[scene]]
id = "crypto"
file = "tvis/scenes/crypto.py"
class = "SealingCryptoBoundary"
plan = "tvis.plans.crypto"
status = "source-derived-proof"
claim = "Source-derived seal_record correctness is conditional on Realizes; RustCrypto performs AES-SIV, while 22-byte header encoding has its own source-derived theorem."
narration = "This scene deliberately shows the same core twice, before and after its call to an external primitive. The source-derived seal_record theorem states exactly which authenticated record and refusal branches the production Rust core implements, provided its Keyed primitive satisfies Realizes. The primitive actually computes AES-SIV over plaintext using three distinct associated data components: domain, public configuration and exact Git pathname. Cryptographic correctness and hardness are trusted and extensively tested, not proved in Lean. When the tag and ciphertext return, the core arranges the fixed header, whose 22-byte layout has a separate unconditional source-derived theorem. This is why one green badge cannot be painted over the entire transaction."
sources = ["rust/crates/transcrypt-v3-core/src/lib.rs", "rust/crates/transcrypt-rs/src/lib.rs", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "proofs/aeneas/v3/V3Wire/Verification/Codec.lean", "docs/verification/V3-ASSUMPTIONS.md"]
proof_anchors = ["seal_record_spec", "encode_file_header_refines"]

[[scene]]
id = "record"
file = "tvis/scenes/record.py"
class = "V3RecordAnatomy"
plan = "tvis.plans.record"
status = "source-derived-proof"
claim = "The 22-byte record header has a proved serializer/parser correspondence; the AES-SIV tag and ciphertext depend on the trusted primitive implementation."
narration = "Zoom into one public Git blob. The fixed file header is twenty two bytes: a six byte version marker followed by a sixteen byte identifier of the authenticated repository configuration. A sixteen byte synthetic initialization vector tag comes next, followed by ciphertext of the file's content. The configuration itself is a separate fifty five byte committed object. The cryptographic associated data contains the domain, full public configuration, and exact Git pathname as separate components. This is an explanatory exploded view; the fields are concatenated bytes, not a series of nested encrypted containers. The formal wire codec proofs cover the header and field decisions. The cryptographic strength of the tag is an external assumption."
sources = ["docs/verification/specs/V3-AUTHENTICATED-P0.md", "proofs/aeneas/v3/V3Wire/Verification/Codec.lean", "rust/crates/transcrypt-v3-core/src/lib.rs"]
proof_anchors = ["encode_file_header_refines", "parse_file_header_spec"]

[[scene]]
id = "rename"
file = "tvis/scenes/rename.py"
class = "PathRebindingLifecycle"
plan = "tvis.plans.rename"
status = "source-derived-proof"
claim = "Production seal_action decides how a moved staged record is handled; native old-path lookup is tested, and resealing the new path is conditionally proved under Realizes."
narration = "A normal Git move may transfer ciphertext whose associated data still names its original path. Merely copying this record would not give valid authentication for the new location. The tested adapter checks staged objects by plain object IDs and compares current worktree facts with HEAD. The actual production seal_action decision has a source-derived Lean theorem: the combination of an authentic old-path record, changes and move flags determines Seal, Rebind or Refuse. Rebinding calls the source-derived open and seal functions with the old and new exact raw path, under the explicit crypto premise Realizes. External Git rename detection and adapter correspondence are still covered by tests, not a complete Lean proof."
sources = ["rust/crates/transcrypt-rs/src/lifecycle.rs", "rust/crates/transcrypt-v3-core/src/lib.rs", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "proofs/aeneas/v3/V3Wire/Verification/Bytes.lean", "docs/verification/V3-ASSUMPTIONS.md", "docs/verification/V3-PROOF-COVERAGE.md"]
proof_anchors = ["seal_action_spec", "seal_record_spec"]

[[scene]]
id = "audit"
file = "tvis/scenes/audit.py"
class = "AuditDeploymentBoundary"
plan = "tvis.plans.audit"
status = "runtime-tested"
claim = "Source-derived record_envelope_ok checks keyless envelope shape, not tag authenticity; actual history traversal is tested Rust/Git, and remote enforcement exists only where installed."
narration = "An auditor may have no key. It can still walk a Git commit tree and require selected paths to contain well-formed encrypted envelopes rather than obvious plaintext. The production record_envelope_ok shape checker has a source-derived theorem, but a hostile record can mimic the same shape without being a genuine authenticated ciphertext. Full cryptographic verification requires an unlocked key and the open_record condition. Real audit and pre-push traversal use Git commands through a tested adapter. A protected remote needs a deployed server hook or mandatory audit; deployment is not guaranteed by the Lean theorem. The two trust boundaries A13 and A14 must remain visible on every audit visualization."
sources = ["rust/crates/transcrypt-rs/src/audit.rs", "rust/crates/transcrypt-rs/src/lifecycle.rs", "proofs/aeneas/v3/V3Wire/Verification/Envelope.lean", "docs/verification/V3-ASSUMPTIONS.md", "docs/verification/V3-PROOF-COVERAGE.md"]
proof_anchors = ["record_envelope_ok_spec"]

[[scene]]
id = "clone"
file = "tvis/scenes/clone.py"
class = "UnlockAndHydrate"
plan = "tvis.plans.clone"
status = "source-derived-proof"
claim = "After public clone, the current default unlock stores a derived local key; open_record is conditional source-derived proof, while smudge/hydrate publication is tested native behavior."
narration = "A public clone obtains ciphertext records and a public authenticated configuration. In this snapshot the default unlock uses a derived local key stored under Git private metadata and --private switches to a memory-only agent. The stored key is not a Lean theorem about workstation secrecy. The source-derived open_record theorem ensures that an accepted record opens to exactly the authenticated bytes for this config and pathname if the external primitive realizes its contract. Native hydrate and smudge use the result to place plaintext in the checkout; the actual writes and Git timing remain tested adapter assumptions. The remote retains its ciphertext."
sources = ["rust/crates/transcrypt-rs/src/session.rs", "rust/crates/transcrypt-rs/src/credential.rs", "rust/crates/transcrypt-rs/src/worktree.rs", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "docs/verification/V3-PROOF-COVERAGE.md", "docs/verification/V3-ASSUMPTIONS.md"]
proof_anchors = ["open_record_spec", "open_record_complete"]

[[scene]]
id = "lock"
file = "tvis/scenes/lock.py"
class = "LockAndFlushLifecycle"
plan = "tvis.plans.lock"
status = "runtime-tested"
claim = "Actual lock_action is source-derived proved, but real staged snapshot checks, file replacement and key deletion are tested effects; lockEntry is a separate model theorem."
narration = "The unlocked checkout is plaintext and has a usable local key. Lock does not simply delete that key: first the native Rust adapter checks the index and uncommitted edits, reseals the candidate content, and prepares the worktree replacement. The actual lock_action decision has a Lean theorem, while lockEntry_spec is a separate theorem about a Lean-defined sequencing model. The real writer uses stamped file checks, filesystem writes and renames that are tested and reviewed, not source-derived proved. If any worktree cannot safely flush, the key remains available. Only after every worktree succeeds does lock forget the stored key or stop the optional memory agent. This is not secure erasure of all prior plaintext copies."
sources = ["rust/crates/transcrypt-rs/src/lifecycle.rs", "rust/crates/transcrypt-rs/src/credential.rs", "proofs/aeneas/v3/V3Wire/Verification/Bytes.lean", "proofs/aeneas/v3/V3Wire/Verification/Lifecycle.lean", "docs/verification/V3-ASSUMPTIONS.md"]
proof_anchors = ["lock_action_spec", "lockEntry_spec"]

[[scene]]
id = "attack"
file = "tvis/scenes/attack.py"
class = "AuthenticationRejection"
plan = "tvis.plans.attack"
status = "source-derived-proof"
claim = "The verified open_record gate does not release untrusted bytes on a failed authentication; cryptographic unforgeability is assumed, not proved in Lean."
narration = "A public history can be copied and edited by an offline adversary. Suppose someone changes a ciphertext byte, swaps the object from another path, or copies it from another repository. The decoder accepts only a record that authenticates under the expected configuration and exact pathname. The Lean theorem connects the production open record decision to this precise specification. Under the assumption that the AES SIV library implements the intended primitive, failed authentication releases no plaintext; the core zeroes the affected output buffer. The mathematical theorem proves the core's control logic, not the computational hardness of forging the tag."
sources = ["proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "docs/verification/V3-ASSUMPTIONS.md", "tests/v3/reference/check_vectors.py", "rust/crates/transcrypt-rs/src/lib.rs"]
proof_anchors = ["open_record_spec", "open_record_complete"]

[[scene]]
id = "status"
file = "tvis/scenes/status.py"
class = "VerificationStatus"
plan = "tvis.plans.status"
status = "architecture"
claim = "V0-V5 achieved in their scoped roadmap; P0-P5 product tracks done, including core proof correspondence. V6 internal evidence exists but P6 / R-01 independent review is outstanding; Bash v3 V7 is deferred. This is not a whole-program verification percentage."
narration = "The active roadmap distinguishes proof milestones from product milestones. V0 through V5 are achieved for their documented scope. Source-derived Lean contracts cover actual translated Rust encoders, parsers, and security decisions; seal, open and authentication require the Realizes primitive contract. The Lean hydrate, lock, verify and filter sequencing theorems are model proofs, not a source-derived proof of the effectful adapter. The product tracks P0 through P5 are implemented, tested and considered done for their scoped objectives: real adapter defects, arbitrary attribute-selected paths, stored derived keys by default, transparent Git use, migration, and core proof correspondence. P6, independent external cryptographic and adapter review R-01, is explicitly unfinished. V6 has its internal portion done, but is not release-certified. Bash v3 conformance V7 is intentionally deferred. Treat these as discrete evidence-backed statuses, not an invented percentage of verified executable code."
sources = ["docs/verification/V3-ROADMAP.md", "docs/verification/V3-PRODUCT-CHARTER.md", "docs/verification/V3-PROOF-COVERAGE.md", "docs/verification/V3-ASSUMPTIONS.md", "proofs/aeneas/v3/PROOF-STATUS.md", "proofs/aeneas/v3/V3Wire/Verification/Bytes.lean", "proofs/aeneas/v3/V3Wire/Verification/Lifecycle.lean", "proofs/aeneas/v3/V3Wire/Verification/Codec.lean", "proofs/aeneas/v3/V3Wire/Verification/Filters.lean"]
proof_anchors = ["seal_action_spec", "hydratePlan_spec", "encode_file_header_refines", "cleanModel_genuine"]

[[scene]]
id = "inventory"
file = "tvis/scenes/inventory.py"
class = "ProvenFunctionInventory"
plan = "tvis.plans.inventory"
status = "source-derived-proof"
claim = "Concrete inventory of proved production Rust codecs, protocol decisions and parsers, distinguished from Lean-only lifecycle models."
narration = "This inventory names actual theorem-backed production functions and distinguishes them from standalone sequencing models. The fifty five byte public config and twenty two byte file header codecs have source-derived theorems. Canonical path policy now permits any Git-attribute-selected file except reserved metadata, and source-derived functions parse full NUL-delimited Git attribute answers, index entries, packet lengths and request headers. seal_record and open_record refine the independent spec only under the explicit Realizes primitive contract. The hydrate, lock, clean and verify lifecycle models have separate Lean theorems; they do not prove the actual native adapter, Git behavior or filesystem effects. A green operation label applies only to the named theorem and its hypotheses."
sources = ["proofs/aeneas/v3/PROOF-STATUS.md", "proofs/aeneas/v3/V3Wire/Verification/Codec.lean", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "proofs/aeneas/v3/V3Wire/Verification/Path.lean", "proofs/aeneas/v3/V3Wire/Verification/Attr.lean", "proofs/aeneas/v3/V3Wire/Verification/Index.lean", "proofs/aeneas/v3/V3Wire/Verification/Pkt.lean", "proofs/aeneas/v3/V3Wire/Verification/Lifecycle.lean", "docs/verification/V3-PROOF-COVERAGE.md"]
proof_anchors = ["encode_file_header_refines", "parse_index_entry_spec", "decode_pkt_len_spec", "open_record_spec", "hydratePlan_spec"]

[[scene]]
id = "contract"
file = "tvis/scenes/contract.py"
class = "OpenRecordContract"
plan = "tvis.plans.contract"
status = "source-derived-proof"
claim = "Actual Aeneas-translated Rust open_record has a conditional Lean WP.spec theorem: success returns exactly authenticated bytes, authentication failure zeroes output, other refusals preserve output; Realizes is an external assumption."
narration = "Let us look at a single theorem instead of vague statements about verification. The actual Rust function is open record, translated into Lean by Aeneas. The theorem is called open_record_spec, and its first explicit argument is h colon Realizes inst prims sigma. That is not a proved property of RustCrypto; it is a premise. The theorem covers every input of the stated types. If open record returns success, its output satisfies OpensTo for the exact configuration, pathname, and record supplied. If it returns Authentication error, it zeroes the output and proves the record was not an authentic sealing of any same length plaintext at this path. Other failure branches identify what was wrong and keep the output untouched. A full weakest precondition specification also excludes panics and divergence in the translated computation. What is not being proved? That AES SIV is unforgeable, that the RustCrypto code correctly realizes its abstract contract, that Git invokes the filter for every selected file, or that native filesystem operations follow the modeled plan. Those distinct premises are where future security analysis must concentrate."
sources = ["proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "proofs/lean/Transcrypt/V3Policy.lean", "docs/verification/V3-ASSUMPTIONS.md", "proofs/aeneas/v3/PROOF-STATUS.md"]
proof_anchors = ["open_record_spec", "open_record_complete"]

[[scene]]
id = "proof"
file = "tvis/scenes/proof.py"
class = "RustLeanRefinement"
plan = "tvis.plans.proof"
status = "source-derived-proof"
claim = "Theorems mention real Aeneas-translated production functions and an independently maintained Lean spec; translation soundness is a separate assumption."
narration = "This is the key difference between a verified implementation and an unrelated model. There are two inputs to the theorem. One comes from the production Rust core, through pinned Charon and Aeneas translation into Lean computations. The other is the independent mathematical description of the file format and security decisions. Lean proves a proposition relating those two. For example encode file header refines says exactly which bytes that encoder writes. Open record spec says what success and failure mean. Such proofs cover every input admitted by the proposition, not just examples. But correctness of the translator, the primitive contract called Realizes, and the way the larger executable uses this function still sit outside the theorem."
sources = ["proofs/aeneas/v3/V3Wire/Verification/Codec.lean", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "proofs/aeneas/v3/PROOF-STATUS.md", "proofs/aeneas/v3/SNAPSHOT.json", "proofs/lean/Transcrypt/V3Policy.lean"]
proof_anchors = ["encode_file_header_refines", "parse_config_spec", "open_record_spec"]

[[scene]]
id = "lifecycle"
file = "tvis/scenes/lifecycle.py"
class = "LifecycleModelBoundary"
plan = "tvis.plans.lifecycle"
status = "model-proof"
claim = "Actual source-derived open gate + Lean-only sequencing model + tested effectful adapter are three distinct tiers; Git/OS effects are never promoted into a whole-program proof."
narration = "Look at the badge beneath each operation, not the title of the whole scene. Git exposes a staged object and its raw path under trusted platform semantics. The actual production open_record core has a conditional source-derived theorem. The separately written Lean model proves conditions for hydrate, lock and verify sequencing but its purple label is not a refinement proof of the Unix and Git adapter. Finally native Rust and the operating system perform file writes and stamps, covered by tests and reviews, not by a current source-derived Lean theorem. The moving data marker changes from ciphertext to an authenticated decision and then to side-effect instructions. A4 is the correspondence gap."
sources = ["proofs/aeneas/v3/V3Wire/Verification/Lifecycle.lean", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "docs/verification/V3-PROOF-COVERAGE.md", "docs/verification/V3-ASSUMPTIONS.md"]
proof_anchors = ["hydratePlan_spec", "lockEntry_spec", "verifyPlan_spec"]

[[scene]]
id = "adapter"
file = "tvis/scenes/adapter.py"
class = "AdapterCorrespondence"
plan = "tvis.plans.adapter"
status = "model-proof"
claim = "The remaining A4 gap is the connection between proved byte/decision functions and production Git/OS inputs and effects. Git selection (A19), cat-file response framing, move provenance, stored-key loading and native filesystem effects are separately tested or assumed."
narration = "A4 is not a missing branch in seal_action_spec. Git evaluates .gitattributes under A19; the actual Rust parse_attr_response parser is source-derived proved, including completeness for well-formed Git replies. The adapter creates the requests and obtains the reply. The is_object_id function is proved to recognize literal Git object ID syntax, but the effectful cat-file --batch framing and record consumption remain adapter review and test obligations. Rename repair is governed by seal_action_spec for supplied local_change and moved facts, not by a proof that the adapter computed those facts correctly. Stored key selection is implemented and tested; authenticate_config_spec checks the cryptographic configuration only conditional on Realizes. The actual stamp check, renameat, fsync and key deletion are native A8/A12 operations covered by tests and accepted race assumptions, not Lean effects. Next valuable steps extract pure response checks and input-selection decisions where that meaningfully shrinks A4. Do not pretend to have proved Git, Unix or RustCrypto."
sources = ["docs/verification/V3-ASSUMPTIONS.md", "docs/verification/V3-PROOF-COVERAGE.md", "docs/verification/V3-ROADMAP.md", "docs/verification/V3-REVIEW-TRIAGE.md", "proofs/aeneas/v3/V3Wire/Verification/Attr.lean", "proofs/aeneas/v3/V3Wire/Verification/Envelope.lean", "proofs/aeneas/v3/V3Wire/Verification/Bytes.lean", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean"]
proof_anchors = ["parse_attr_response_spec", "parse_attr_response_complete", "is_object_id_spec", "seal_action_spec", "authenticate_config_spec"]

[[scene]]
id = "assumptions"
file = "tvis/scenes/assumptions.py"
class = "TrustBoundary"
plan = "tvis.plans.assumptions"
status = "external-assumption"
claim = "Formal theorems cover the production core, while translation, RustCrypto, effectful Git/OS adapter behavior, and remote hook deployment remain separate premises."
narration = "Now draw a line around what is actually machine checked. The source-derived codec and security decision core is the green component. To interpret its proof as a claim about Rust source, we assume that Charon and Aeneas translate correctly. We also assume that the RustCrypto instance realizes the stated AES SIV and hash contracts, and that the algorithms are secure. Outside the core, Git attribute selection, object reads, filesystem effects, and credential-agent behavior are exercised by tests and modeled theorems, not completely extracted and proved. Finally, a keyless server audit can detect malformed records and accidental plaintext only if someone deploys it; recognizing a record shape does not authenticate its tag."
sources = ["docs/verification/V3-ASSUMPTIONS.md", "docs/verification/V3-PROOF-COVERAGE.md", "proofs/aeneas/v3/PROOF-STATUS.md", "proofs/aeneas/v3/V3Wire/Verification/Protocol.lean", "proofs/aeneas/v3/V3Wire/Verification/Path.lean"]
proof_anchors = ["authenticate_config_spec"]

[[scene]]
id = "offline"
file = "tvis/scenes/offline.py"
class = "OfflineThreatModel"
plan = "tvis.plans.offline"
status = "external-assumption"
claim = "The primary promise is protection of explicitly selected content in public history against offline readers, not secrecy on an already-unlocked workstation."
narration = "The public repository is the boundary that matters. Everyone can download the committed encrypted record, its salt, path, tag, length and history. Deterministic encryption can reveal whether the same plaintext was committed again under the same context. None of this is encryption of the developer's local disk. An offline attacker can always guess passphrases against public metadata, so the strength of the passphrase and the cost of Argon2id matter. An attacker may also copy older valid Git history. These are documented information leaks and assumptions, not bugs in the serializer or reasons to make ordinary local editing unnecessarily difficult."
sources = ["docs/verification/V3-ASSUMPTIONS.md", "docs/verification/specs/V3-AUTHENTICATED-P0.md", "docs/verification/V3-SECURITY-REVIEW.md"]
optional_sources = ["docs/verification/V3-PRODUCT-CHARTER.md"]

[[scene]]
id = "roadmap"
file = "tvis/scenes/roadmap.py"
class = "ProductNorthStar"
plan = "tvis.plans.roadmap"
status = "design-goal"
claim = "Already shipped in current source: arbitrary Git patterns, stored-key default, legacy migration, and path-rebound renames. Remaining assurance work targets A4 adapter correspondence and external R-01 review; remote audit deployment is optional (A13)."
narration = "The code has moved beyond the older animation. Arbitrary Git attribute patterns are implemented. The default unlock stores its key locally, with optional private memory mode. One-time legacy migration and path-aware rename handling also exist and have regression tests. Remaining work is not to keep advertising those features as future promises. It is to reduce the explicit trusted base: make the real effectful Git and operating-system adapter correspond more directly to the proved core, seek independent cryptographic implementation review and improve verification that history audits are actually deployed where needed. Pinned extraction and proof rebuilding are already implemented maintenance mechanisms and should continue with every core change."
sources = ["docs/verification/V3-ROADMAP.md", "docs/verification/V3-PROOF-COVERAGE.md", "docs/verification/V3-ASSUMPTIONS.md", "proofs/aeneas/v3/PROOF-STATUS.md"]
optional_sources = ["docs/verification/V3-PRODUCT-CHARTER.md"]
