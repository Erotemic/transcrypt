name: Tests

on:
  # Only run tests on push to main branch
  push:
    branches: [main]
  # Run tests for all pull request changes targeting main
  pull_request:
    branches: "**"

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      # https://github.com/luizm/action-sh-checker
      - name: Run shellcheck and shfmt
        uses: luizm/action-sh-checker@master
        with:
          sh_checker_exclude: tests
          sh_checker_comment: true

  test:
    # See available runner images: https://github.com/actions/runner-images
    # Test on older Ubuntu with OpenSSL < 1.1 and newer with OpenSSL >= 1.1
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
            # ubuntu 20.04 runner was deprecated early 2025
            # ubuntu-20.04,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-latest,
            # macOS 12 runner was deprecated late 2024
            # macos-12,
            # macOS 13 runner was deprecated Feb 2026
            # macos-13,
            macos-14,
            macos-15,
            macos-latest,
          ]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Print bash version
        run: bash --version

      - name: Print OpenSSL version
        run: openssl version

      - name: Print Git version
        run: git version

      # Configure default Git branch name to suppress hint warnings
      - name: Configure default Git branch to "main"
        run: git config --global init.defaultBranch main

      - name: Install and set up bats-core
        run: |
          git clone https://github.com/bats-core/bats-core.git /tmp/bats-core-repo
          mkdir -p /tmp/bats-core
          bash /tmp/bats-core-repo/install.sh /tmp/bats-core

      # GNU parallel enables bats --jobs
      - name: Install GNU parallel
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install parallel
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq parallel
          fi

      - name: Run tests
        run: /tmp/bats-core/bin/bats --jobs 4 tests/v2/ tests/v3/

  rust:
    # Independent Rust test job (docs/verification/04): the core crates
    # are zero-dependency, so this needs no registry access. The v2
    # differential test requires openssl, present on every matrix OS.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    steps:
      - uses: actions/checkout@v2

      - name: Print rustc version
        run: rustc --version

      - name: Run Rust tests (offline)
        working-directory: rust
        run: cargo test --offline

  feasibility-probe:
    # D-01/D-02 evidence (docs/verification/reference/d01-d02-feasibility.md):
    # record which cryptographic primitives the allowed Bash/OpenSSL runtime
    # can compute per platform, including process-argv inspection.
    # Non-cryptographic by design: no user secrets, $TMPDIR only.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest
          - macos-14
          - macos-15
          - macos-latest

    steps:
      - uses: actions/checkout@v2

      - name: Print openssl version
        run: openssl version

      - name: Run OpenSSL CLI feasibility probe
        run: bash contrib/verification/d02-openssl-cli-probe.sh

  proof-base64-smt:
    # Development-only proof check. The shipped Bash tool has NO Z3
    # dependency. This proves fixed-width Base64 transformations, not
    # the complete Rust/Aeneas refinement or encryption security.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3 development linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libz3-dev
      - name: Prove universal Base64 bit-vector obligations
        run: bash proofs/smt/run-base64-proof.sh
      - name: Prove universal preflight-policy obligations
        run: bash proofs/smt/run-policy-proof.sh

  proof-base64-lean:
    # Independent Lean check of equivalent pure bit-vector obligations.
    # Aeneas extraction from Rust is a later, separate mandatory gate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/lean
          test: false
          use-mathlib-cache: false
