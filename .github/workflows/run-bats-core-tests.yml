name: Tests

on:
  push:
    branches: [master, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Rust toolchain every Rust job uses (as scripts/build-release.sh does).
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned shellcheck and shfmt
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          curl -fsSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          sha256sum -c - <<'EOF'
          1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc  shfmt
          6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  shellcheck.tar.xz
          EOF
          tar -xJf shellcheck.tar.xz
          install -m 0755 shfmt bin/shfmt
          install -m 0755 shellcheck-v0.10.0/shellcheck bin/shellcheck
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint shell scripts
        run: scripts/lint-shell.sh

  test:
    # The Bash implementation (v2) and its v3 Bats suites.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Print versions
        run: |
          bash --version | head -n 1
          openssl version
          git version
      # Configure default Git branch name to suppress hint warnings
      - name: Configure default Git branch to "main"
        run: git config --global init.defaultBranch main
      - name: Install bats-core
        run: |
          git clone -q --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core-repo"
          bash "$RUNNER_TEMP/bats-core-repo/install.sh" "$RUNNER_TEMP/bats-core"
      # GNU parallel enables bats --jobs
      - name: Install GNU parallel
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install parallel
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq parallel
          fi
      - name: Run tests
        run: '"$RUNNER_TEMP/bats-core/bin/bats" --jobs 4 tests/v2/ tests/v3/'

  rust:
    # The v3 executable and the legacy-v2 parity crates, built from source.
    # ubuntu-22.04 has Git 2.34, the oldest Git the adapter supports. Windows
    # builds with the MSVC toolchain here (releases cross-build with mingw;
    # the release workflow tests that binary on Windows).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.test
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Print versions
        run: |
          git --version
          rustc --version
      - name: Check Bash v2 byte contract
        if: runner.os != 'Windows'
        run: bash tests/interop/check-bash-legacy-contract.sh
      - name: Check v3 proof input tooling (no mock proof claims)
        if: runner.os != 'Windows'
        run: python3 proofs/aeneas/tests/test_v3_proof_inputs.py -v
      - name: Test legacy-v2 parity against Bash
        # Bash transcrypt (v2) never supported Windows.
        if: runner.os != 'Windows'
        working-directory: rust-legacy
        run: cargo test --locked --workspace
      - name: Test the v3 end-to-end Git lifecycle
        working-directory: rust
        run: cargo test --locked --workspace
      - name: Clippy (warnings are errors)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          (cd rust && cargo clippy --locked --workspace --all-targets -- -D warnings)
          (cd rust-legacy && cargo clippy --locked --workspace --all-targets -- -D warnings)
      - name: Check dependencies against the RustSec advisory database
        if: matrix.os == 'ubuntu-24.04'
        working-directory: rust
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo audit --deny warnings

  freebsd:
    # The v3 suite and the legacy-v2 parity on FreeBSD (in a VM on a Linux
    # runner), as an unprivileged user like the other runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test on FreeBSD 14
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          mem: 8192
          envs: RUST_TOOLCHAIN
          prepare: |
            pkg install -y git bash python3 curl ca_root_nss
            pw useradd ci -m -s /bin/sh
          run: |
            set -e
            chown -R ci .
            su ci -c '
              set -e
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              . "$HOME/.cargo/env"
              git config --global user.name CI
              git config --global user.email ci@example.test
              git config --global init.defaultBranch main
              (cd rust && cargo test --locked --workspace)
              (cd rust-legacy && cargo test --locked --workspace)
            '

  linux-release:
    # The release archives, built exactly as a release is (scripts/
    # build-release.sh), with the suite run against the static binary on
    # each architecture.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup if missing
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Build both archives and test the native one
        run: scripts/build-release.sh --test --out dist
      - name: Install from the archives
        run: |
          sh scripts/install.sh --from dist --prefix "$RUNNER_TEMP/install"
          "$RUNNER_TEMP/install/bin/transcrypt-rs" --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archives-${{ matrix.os }}
          path: dist/
          retention-days: 7

  v3-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install independent reference crypto libraries (test only)
        run: python -m pip install cryptography==46.0.4 argon2-cffi==25.1.0
      - name: Verify independent AES-SIV / Argon2id vectors
        run: python tests/v3/reference/check_vectors.py -v
      - name: Verify the differential AES-SIV / Argon2id corpus
        run: python tests/v3/reference/differential.py
      - name: Verify raw Git %f pathname transport
        run: python -m unittest discover -s tests/v3/reference -p 'test_git_filter_paths.py' -v
      - name: Verify staged Git attributes and local override precedence
        run: python -m unittest discover -s tests/v3/reference -p 'test_git_staged_attributes.py' -v

  feasibility-probe:
    # D-01/D-02 evidence (docs/verification/reference/d01-d02-feasibility.md):
    # record which cryptographic primitives the allowed Bash/OpenSSL runtime
    # can compute per platform, including process-argv inspection.
    # Non-cryptographic by design: no user secrets, $TMPDIR only.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Print openssl version
        run: openssl version
      - name: Run OpenSSL CLI feasibility probe
        run: bash contrib/verification/d02-openssl-cli-probe.sh

  proof-base64-lean:
    # Independent Lean check of equivalent pure bit-vector obligations, and
    # the v3 policy specification, on each OS (FreeBSD: freebsd-proofs).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/lean
          test: false
          use-mathlib-cache: false

  v3-tracked-aeneas-refinement:
    # The tracked definitions come from the production Rust v3 codec. Compile
    # them together with the independent specification and imported theorems,
    # on each OS that Lean supports (FreeBSD: freebsd-proofs).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify code provenance and snapshot regression tests
        run: |
          # The proof-input tests create symlinks, which Windows restricts.
          if [ "$RUNNER_OS" != Windows ]; then python -m unittest discover -s proofs/aeneas/tests -p 'test_v3_*.py' -v; fi
          python proofs/aeneas/v3_snapshot.py verify
          python proofs/aeneas/v3_snapshot.py stage
      - name: Lean build of actual generated code and refinement theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/aeneas/v3
          test: false
          use-mathlib-cache: true
      - name: Axiom audit of headline refinement theorems
        run: bash proofs/aeneas/check-v3-axioms.sh

  v3-aeneas-regeneration:
    # No synthetic model: rerun the pinned real translator, diff the exact
    # checked-in Aeneas output, and require toolchain/dependency agreement.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned managed Charon/Aeneas driver
        run: cargo install --locked --version 0.4.2 cargo-hax
      - name: Re-extract actual Rust and compare with tracked Lean snapshot
        run: |
          bash proofs/aeneas/translate-v3-core.sh
          python3 proofs/aeneas/v3_snapshot.py compare
