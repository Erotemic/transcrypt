name: Release

# transcrypt-rs release archives: Linux (x86_64, arm64; static), FreeBSD,
# NetBSD and OpenBSD (x86_64), Windows (x86_64; static CRT) and macOS (arm64, x86_64). Every
# archive is built by scripts/build-release.sh, the same script used without
# CI, and every binary is tested on its own OS (the whole suite, against the
# archive's binary) before anything is published. The Linux archives are
# built on an x86_64 and an arm64 host; they should be byte-identical (a
# difference is reported). A `v3-*` tag publishes a draft release; a manual
# run, or a change to the release machinery itself, only builds and tests
# (GitHub cannot dispatch a workflow that is not yet on the default branch).
on:
  push:
    tags: ["v3-*"]
    # Path filters are not applied to tag pushes.
    branches: ["**"]
    paths: [.github/workflows/release.yml, scripts/build-release.sh]
  pull_request:
    paths: [.github/workflows/release.yml, scripts/build-release.sh]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  build-linux-host:
    # The Linux, FreeBSD and Windows archives (cross-built: rust-lld, clang
    # with the pinned FreeBSD base libraries, mingw-w64).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the cross linkers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Install rustup if missing
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Build the archives and test the native one
        run: scripts/build-release.sh --test --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-host
          path: dist/

  rebuild-linux-arm64:
    # The Linux archives again, on an arm64 host, to compare.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup if missing
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Build the Linux archives and test the native one
        run: scripts/build-release.sh --test --out dist x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-arm64
          path: dist/

  build-macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU tar and rustup if missing
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure Git
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.test
      - name: Build the archives and test the native one
        run: scripts/build-release.sh --test --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/

  build-openbsd:
    # The OpenBSD archive, built and tested natively (OpenBSD's own Rust;
    # the archive is for this OpenBSD release only).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on OpenBSD 7.9
        uses: cross-platform-actions/action@ef53f0d3fd471648f2758f3fcdc3cb2aa40c87cb # v1.7.0
        with:
          operating_system: openbsd
          version: "7.9"
          memory: 8G
          run: |
            set -e
            sudo pkg_add -I rust git bash
            sudo pkg_add gtar--
            git config --global user.name CI
            git config --global user.email ci@example.test
            git config --global init.defaultBranch main
            bash scripts/build-release.sh --test --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-openbsd
          path: dist/

  test-windows:
    # The suite against the Windows archive's binary, installed by install.ps1.
    needs: build-linux-host
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-host
          path: dist
      - name: Install the archive
        shell: pwsh
        run: ./scripts/install.ps1 -From dist -Prefix "$env:RUNNER_TEMP\install"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Test the installed binary
        working-directory: rust
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.test
          TRANSCRYPT_RS_TEST_BIN="$RUNNER_TEMP\\install\\bin\\transcrypt-rs.exe" cargo test --locked -p transcrypt-rs

  test-freebsd:
    # The suite against the FreeBSD archive's binary, installed by install.sh.
    needs: build-linux-host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-host
          path: dist
      - name: Test on FreeBSD 14
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          mem: 8192
          envs: RUST_TOOLCHAIN
          prepare: |
            pkg install -y git bash python3 curl ca_root_nss
            pw useradd ci -m -s /bin/sh
          run: |
            set -e
            chown -R ci .
            su ci -c '
              set -e
              sh scripts/install.sh --from dist --prefix "$HOME/install"
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              . "$HOME/.cargo/env"
              git config --global user.name CI
              git config --global user.email ci@example.test
              git config --global init.defaultBranch main
              cd rust && TRANSCRYPT_RS_TEST_BIN="$HOME/install/bin/transcrypt-rs" cargo test --locked -p transcrypt-rs
            '

  test-netbsd:
    # The suite against the NetBSD archive's binary, installed by install.sh.
    needs: build-linux-host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-host
          path: dist
      - name: Test on NetBSD 10.1
        uses: cross-platform-actions/action@ef53f0d3fd471648f2758f3fcdc3cb2aa40c87cb # v1.7.0
        with:
          operating_system: netbsd
          version: "10.1"
          memory: 8G
          environment_variables: RUST_TOOLCHAIN
          run: |
            set -e
            sudo pkgin -y install git bash curl mozilla-rootcerts-openssl
            sh scripts/install.sh --from dist --prefix "$HOME/install"
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
            . "$HOME/.cargo/env"
            git config --global user.name CI
            git config --global user.email ci@example.test
            git config --global init.defaultBranch main
            cd rust && TRANSCRYPT_RS_TEST_BIN="$HOME/install/bin/transcrypt-rs" cargo test --locked -p transcrypt-rs

  publish:
    needs: [build-linux-host, rebuild-linux-arm64, build-macos, build-openbsd, test-windows, test-freebsd, test-netbsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Check, compare and collect the archives
        run: |
          (cd dist-linux-host && sha256sum -c SHA256SUMS)
          (cd dist-linux-arm64 && sha256sum -c SHA256SUMS)
          (cd dist-macos && shasum -a 256 -c SHA256SUMS)
          if ! grep linux dist-linux-host/SHA256SUMS | cmp -s - dist-linux-arm64/SHA256SUMS; then
            echo "::warning::the x86_64 and arm64 hosts built different Linux archives (not reproducible across hosts)"
            diff <(grep linux dist-linux-host/SHA256SUMS) dist-linux-arm64/SHA256SUMS || true
          fi
          mkdir release
          (cd dist-openbsd && sha256sum -c SHA256SUMS)
          cp dist-linux-host/*.tar.gz dist-linux-host/*.zip dist-macos/*.tar.gz dist-openbsd/*.tar.gz release/
          cat dist-linux-host/SHA256SUMS dist-macos/SHA256SUMS dist-openbsd/SHA256SUMS | sort -k 2 > release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v3-')
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v3-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "transcrypt-rs ${GITHUB_REF_NAME#v3-}" --notes-file - \
            release/*.tar.gz release/*.zip release/SHA256SUMS <<'EOF'
          transcrypt-rs for Linux (x86_64, arm64; static), FreeBSD 14.4+, NetBSD 10.1+ and OpenBSD 7.9 (x86_64),
          macOS (arm64, x86_64) and Windows 10 1803 and later (x86_64). It needs only Git 2.34 or later
          (on Windows, Git for Windows). Each binary passed the full test suite on its own OS.
          Install: `scripts/install.sh` (Linux, the BSDs, macOS) or `scripts/install.ps1` (Windows) from
          the repository, or unpack the archive for your system and put `transcrypt-rs` on your PATH.
          Verify with `sha256sum -c SHA256SUMS` and `gh attestation verify <archive> --repo Erotemic/transcrypt`.
          Rebuild and compare: `scripts/build-release.sh` at this tag (docs/RELEASING.md).
          EOF
