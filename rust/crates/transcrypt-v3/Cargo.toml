[package]
name = "transcrypt-v3"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Authenticated deterministic Rust Transcrypt v3 proof of concept"

[dependencies]
transcrypt-v3-core = { path = "../transcrypt-v3-core" }
# `zeroize` wipes the AES/CMAC/CTR key schedules when each SIV instance drops.
aes-siv = { version = "=0.8.0", features = ["zeroize"] }
aes = { version = "=0.9.3", features = ["zeroize"] }
cmac = { version = "=0.8.0", features = ["zeroize"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
# `zeroize` wipes Argon2's 64 MiB of password-derived memory blocks and its
# initial hash when key derivation finishes.
argon2 = { version = "=0.6.0", features = ["zeroize"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
rpassword = "=7.4.0"
zeroize = "=1.9.1"
# Agent hardening: disable core dumps and lock the key page in memory.
libc = "=0.2.191"

[[bin]]
name = "transcrypt-v3"
path = "src/main.rs"
