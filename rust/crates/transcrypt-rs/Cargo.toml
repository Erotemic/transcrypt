[package]
name = "transcrypt-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Transcrypt v3 in Rust: authenticated encryption of the files you choose, in Git"

[dependencies]
transcrypt-v3-core = { path = "../transcrypt-v3-core" }
# `zeroize` wipes the AES/CMAC/CTR key schedules when each SIV instance drops.
aes-siv = { version = "=0.8.0", features = ["zeroize"] }
aes = { version = "=0.9.3", features = ["zeroize"] }
cmac = { version = "=0.8.0", features = ["zeroize"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
# `zeroize` wipes Argon2's 64 MiB of password-derived memory blocks and its
# initial hash when key derivation finishes.
argon2 = { version = "=0.6.0", features = ["zeroize"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
rpassword = "=7.4.0"
zeroize = "=1.9.1"

[target.'cfg(unix)'.dependencies]
# The OS adapter (`os_unix.rs`, `fsat.rs`): dirfd I/O, the agent socket's
# peer credentials, and agent hardening (no core dumps, key page locked).
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
# The OS adapter (`os_windows.rs`, `fsat_windows.rs`): handle-relative
# NtCreateFile, owner-only DACLs and the agent's AF_UNIX socket.
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[[bin]]
name = "transcrypt-rs"
path = "src/main.rs"
